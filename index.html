<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#667eea">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CHAILIN Finance">
  <link rel="manifest" href="manifest.json">
  <title>CHAILIN Finance</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .loading {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      z-index: 10;
      transition: opacity 0.5s;
    }
    .loading h1 { font-size: 28px; margin-bottom: 10px; }
    .loading p { font-size: 14px; opacity: 0.8; }
    .loading.hide { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div class="loading" id="loadingScreen">
    <h1>CHAILIN Finance</h1>
    <p>Memuat aplikasi...</p>
  </div>

  <!-- GANTI URL DI BAWAH DENGAN URL DEPLOY APPS SCRIPT KAMU -->
  <iframe 
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbxRIpAhJeYkRGpq8AwFi5BxMLGtpn02h0dqR7dC_sbfgJQuoS93h4EsVBTvp0IHXCc-/exec?page=login"
    allow="clipboard-write"
    onload="document.getElementById('loadingScreen').classList.add('hide');">
  </iframe>

  <script>
    // Register Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(function() { console.log('SW registered'); })
        .catch(function(err) { console.log('SW failed:', err); });
    }
  </script>
</body>
</html>
